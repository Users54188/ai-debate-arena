name: CI

# 测试期间的完整 CI：语法 + prompt 镜像一致性，不启用上线护栏（STRICT_LINT 不设）。
# 上线时把下面 syntax step 改成 STRICT_LINT=1 并去掉 CI= 前缀，护栏即生效。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    name: Prompt / eval 镜像一致性
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: verify prompt mirrors
        run: node tools/verify-prompt-mirror.js

  syntax:
    name: JS 语法检查（32 文件，零依赖）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 测试期：不开 STRICT_LINT，配额旁路开关只告警不阻断。
      # 但 GitHub Actions 默认注入 CI=true，会让 check-syntax.js 走严格模式（exit 1），
      # 所以这里必须显式把 CI 置空 —— 见 docs/ci-notes.md。
      - name: syntax check
        run: CI= node tools/check-syntax.js
